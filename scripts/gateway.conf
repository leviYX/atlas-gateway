# 常用参数，只需要在这里修改一次。环境变量可覆盖默认值。
# Linux 默认 io_uring；Mac 请通过 start.sh nio 启动。
TRANSPORT=${TRANSPORT:-io_uring}
MODE=${MODE:-validate}
WORKERS=${WORKERS:-2}
HEAP=${HEAP:-512m}
BIND_HOST=${BIND_HOST:-0.0.0.0}
PORT=${PORT:-8080}
JFR_ENABLED=${JFR_ENABLED:-true}
JFR_SETTINGS=${JFR_SETTINGS:-default}
NMT_ENABLED=${NMT_ENABLED:-false}
BENCH_THREADS=${BENCH_THREADS:-2}
BENCH_CONNECTIONS=${BENCH_CONNECTIONS:-64}
BENCH_WARMUP_SECONDS=${BENCH_WARMUP_SECONDS:-20}
BENCH_DURATION_SECONDS=${BENCH_DURATION_SECONDS:-60}
# 压测自动使用本轮启动记录中的本机地址和端口。
